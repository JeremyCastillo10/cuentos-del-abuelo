name: Solo Facebook

# Sube a Facebook el video ya renderizado de otra ejecución (sin generar uno nuevo)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la ejecución de 'Historia diaria' con el video"
        required: true

jobs:
  facebook:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: historia
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Publicar en Facebook
        run: ls -la out public && python scripts/facebook.py reel
