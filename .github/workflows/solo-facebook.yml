name: Publicar video ya hecho

# Publica el video ya renderizado de otra ejecución (sin generar uno nuevo)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la ejecución de 'Historia diaria' con el video"
        required: true
      instagram:
        description: "¿Publicar también en Instagram?"
        type: boolean
        default: false
      facebook:
        description: "¿Publicar en Facebook?"
        type: boolean
        default: true

jobs:
  facebook:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: historia
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Publicar en Instagram
        if: inputs.instagram
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicar.py
      - name: Publicar en Facebook
        if: inputs.facebook
        run: ls -la out public && python scripts/facebook.py reel
